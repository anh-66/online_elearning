; Cấu hình PHP cho môi trường production trên Render.
memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 64M
max_execution_time = 60
expose_php = Off

; Chỉ rõ bộ chứng chỉ CA của hệ điều hành (gói ca-certificates có sẵn trong image php).
; CloudinaryAdapter tự tắt kiểm tra SSL khi PHP không khai báo curl.cainfo / openssl.cafile,
; nên phải khai báo ở đây để trên Render mọi request tới Cloudinary vẫn được kiểm tra chứng chỉ.
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
