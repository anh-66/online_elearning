# Render Blueprint cho EduLearn.
# Tạo trên Render: New > Blueprint > chọn repo này và nhánh muốn deploy.
# Các biến "sync: false" là secret: Render sẽ hỏi giá trị khi tạo Blueprint và không lưu trong Git.
services:
  - type: web
    name: online-elearning
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: EduLearn
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Tạo bằng: php artisan key:generate --show  (dạng base64:...)
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # MySQL cloud (Aiven, TiDB Cloud, ...). Render không có MySQL managed.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # File CA để bật SSL tới MySQL:
      #   Aiven: thêm Secret File tên ca.pem rồi điền /etc/secrets/ca.pem
      #   TiDB Cloud: điền /etc/ssl/certs/ca-certificates.crt
      - key: MYSQL_ATTR_SSL_CA
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Gửi mail (mã OTP khi đăng ký, quên mật khẩu) qua API của Brevo, gói Free 300 mail/ngày.
      # Render gói Free chặn cổng SMTP nên không dùng Gmail SMTP được. Hướng dẫn: docs/cong-nghe-su-dung.md mục 9.
      - key: MAIL_MAILER
        value: brevo
      # Brevo > Settings > SMTP & API > API Keys & MCP > Generate API key (dạng xkeysib-...)
      - key: BREVO_API_KEY
        sync: false
      # Địa chỉ gửi, phải trùng sender đã xác nhận trong Brevo (Settings > Senders, Domains, IPs > Senders)
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: EduLearn
      # Đặt "false" để tắt nhanh bước nhập mã OTP xác thực email (ví dụ khi Brevo trục trặc).
      - key: EMAIL_OTP_ENABLED
        value: "true"

      # Chạy migrate mỗi lần khởi động (an toàn, chỉ chạy migration mới).
      - key: RUN_MIGRATIONS
        value: "true"
      # Seed dữ liệu mẫu, chỉ chạy khi database còn trống (lần deploy đầu tiên).
      # Đã có dữ liệu thì bỏ qua, nên ảnh banner/avatar/ảnh khóa học đã sửa không bị ghi đè khi restart.
      # Đặt "force" nếu muốn seed lại mỗi lần khởi động (sẽ đặt lại ảnh và mật khẩu mẫu), "false" để tắt hẳn.
      - key: RUN_SEEDERS
        value: "true"

      # File upload (avatar, ảnh khóa học, tài liệu) lưu lên Cloudinary để không bị mất khi restart.
      # Lấy ở Cloudinary Console > API Keys > "API environment variable".
      - key: CLOUDINARY_URL
        sync: false

      # Chat AI tư vấn khóa học (Google Gemini, gói miễn phí). Lấy key ở https://aistudio.google.com/apikey
      # Không có key thì khung chat tự ẩn.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
